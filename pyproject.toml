[project]
name = "yetunde"
version = "0.1.0"
description = "A meta Python package for downloading YouTube videos with yt-dlp"
readme = "README.md"
authors = [
    { name = "yetunde" }
]
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2026.3.17",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
